[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rowdiff"
version = "0.2.0"
description = "Pushdown-first row diff for two database tables: chunked SQL checksums, row-level drift report, resumable"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clawdyy", email = "intertermux@gmail.com" }]
keywords = ["database", "diff", "data-diff", "checksum", "verification", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.0"]
duckdb = ["duckdb>=0.9"]
all = ["rowdiff[postgres,mysql,duckdb]"]
dev = ["pytest>=7"]

[project.scripts]
rowdiff = "rowdiff.cli:main"

[project.urls]
Homepage = "https://github.com/intertermux-code/rowdiff"
Repository = "https://github.com/intertermux-code/rowdiff"
Issues = "https://github.com/intertermux-code/rowdiff/issues"

[tool.setuptools.packages.find]
include = ["rowdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
